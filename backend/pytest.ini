; ===========================================================
; ForestWatch Zambia
; -----------------------------------------------------------
; pytest configuration
;
; testpaths
;     Collection is restricted to tests/ so that running
;     "pytest" from backend/ collects the test suite and
;     nothing else.
;
;     Without it, pytest also walks alembic/versions/ and
;     collects
;
;         alembic/versions/da8e3b0a7357_test.py
;
;     because the name matches python_files. That file is a
;     database migration, not a test. Importing it as one
;     fails collection and takes the whole run down with it.
;
;     The migration is not renamed. It has already been
;     applied to the database, and the note in its header
;     explains why an applied revision is never edited: the
;     migration history is evidence of what the database
;     actually ran. Narrowing collection fixes the problem
;     without rewriting that history.
;
;     It also keeps the suite away from the nested checkout
;     under backend/Forest-Detection-System/, which would
;     otherwise offer a second copy of every test module
;     under the same name.
; ===========================================================

[pytest]
testpaths = tests
